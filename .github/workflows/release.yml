name: Release

# Builds an installer on each platform and attaches it to a draft release.
#
# This exists because a package has to be built on the platform it targets:
# ffmpeg is staged into the app rather than assumed to be on the user's machine,
# and there is no cross-building. Without CI, only the platform on the developer's
# desk can ever ship.
#
# NOTE: this workflow has run once, on v1.0.0 (2026-09-04), and failed on all
# three platforms at typecheck - the lockfile pinned a player from before the
# API the app calls. An earlier version of this comment said it had never run,
# and that went unquestioned through a review, because a comment is easy to
# believe. Nothing past typecheck has run on a runner yet, so the advice stands:
# make the next run a `workflow_dispatch` on a throwaway tag, not a real release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (must already exist)'
        required: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  #
  # The gateway's security checks, as a gate every platform waits for.
  #
  # e2e/security.mjs is what stands between this app and "a way to read
  # someone's disk from a web page", in its own words, and nothing on the
  # release path ran it. It runs once, here, and `build` below needs it. The
  # gateway is the same code on all three platforms, so a failure is a reason to
  # publish nothing - putting the check inside the matrix would have stopped the
  # Windows installer alone while Linux and macOS published anyway.
  #
  # Windows, because that is where each part has been exercised locally against
  # what a runner will use:
  #   - gyan 9.0.1 essentials, downloaded and checked with the same sha256sum
  #     line as below (ffmpeg.zip: OK), carries libvpx-vp9, libopus, testsrc2
  #     and sine
  #   - the synthetic fixture built with that ffmpeg is vp9 854x480 + opus, 40 s
  #   - the suite passed all seventeen checks with that ffmpeg and ffprobe
  # What has NOT been exercised is a hosted runner opening an Electron window.
  # That is known only once this runs.
  #
  # The fixture is synthetic because the real ones are cut from a clip in the
  # sibling player checkout, which a runner does not have. The security suite
  # never looks at content, only at what the gateway agrees to serve.
  #
  # The fetch step repeats the Windows one in `build` on purpose; if either
  # changes, the other has to.
  #
  security:
    name: Security checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch static ffmpeg
        shell: bash
        run: |
          curl -fsSL --retry 3 --retry-all-errors https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -o ffmpeg.zip
          curl -fsSL --retry 3 --retry-all-errors https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip.sha256 -o ffmpeg.zip.sha256
          echo "$(cat ffmpeg.zip.sha256)  ffmpeg.zip" | sha256sum -c -
          unzip -o -q ffmpeg.zip -d ffmpeg-unpacked
          BIN=$(find ffmpeg-unpacked -name 'ffmpeg.exe' -printf '%h\n' | head -1)
          echo "FFMPEG_DIR=$(cygpath -w "$PWD/$BIN")" >> "$GITHUB_ENV"

      - name: Stage ffmpeg, and prove it runs
        run: node scripts/stage-ffmpeg.mjs --from "${{ env.FFMPEG_DIR }}"

      - name: Compile main, preload and renderer
        run: npm run build

      # XPLAYER_FFMPEG and XPLAYER_FFPROBE are the variables the app reads, so
      # the fixture script and the gateway both use the staged binaries rather
      # than whatever is on PATH. Pointed at missing files locally, the script
      # and the suite both failed; neither quietly fell back.
      - name: Build the security fixture
        shell: bash
        run: |
          export XPLAYER_FFMPEG="$(cygpath -w "$PWD/resources/ffmpeg/ffmpeg.exe")"
          node scripts/make-fixtures.mjs --synthetic --only vp9-opus.webm

      - name: Run the gateway's security checks
        shell: bash
        run: |
          export XPLAYER_FFMPEG="$(cygpath -w "$PWD/resources/ffmpeg/ffmpeg.exe")"
          export XPLAYER_FFPROBE="$(cygpath -w "$PWD/resources/ffmpeg/ffprobe.exe")"
          node e2e/security.mjs

  build:
    name: ${{ matrix.name }}
    needs: security
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not throw away the others: a Windows
      # installer is still worth publishing if the macOS build breaks.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            target: --win
          - os: macos-latest
            name: macOS
            target: --mac
          - os: ubuntu-latest
            name: Linux
            target: --linux

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The player is a sibling checkout in development. On a runner it has to
      # come from the published package, which npm ci already installed.
      - name: Check the player is available
        shell: bash
        run: test -f node_modules/x-player/dist/lib/x-player.es.js || (echo "x-player has no build output" && exit 1)

      #
      # ffmpeg has to be a static build.
      #
      # What a package manager installs is dynamically linked against libraries
      # that exist on this runner and nowhere else, so a package built with it
      # would die on a user's machine with a missing library and look like the
      # app was broken. stage-ffmpeg.mjs checks for exactly that and fails the
      # build rather than shipping one.
      #
      # These sources publish rolling builds rather than stable versioned URLs,
      # so the version that ships is whatever was current on build day. The
      # binaries are run before packaging, which is the part that matters.
      #
      # Each download is checked against the digest its own publisher puts
      # beside it, so a corrupted or truncated transfer fails the build rather
      # than being packaged into an installer and shipped. Being clear about
      # what that is worth: it authenticates the transfer, not the publisher.
      # The digest travels from the same host over the same connection as the
      # archive, so anyone who can swap one can swap the other - substitution at
      # the source is not what this catches, and HTTPS already covers a network
      # attacker. The stronger version - pinning a digest in this repository -
      # is deliberately not what this does, because these URLs roll and every
      # new ffmpeg release would then break the release build until someone
      # updated it by hand.
      #
      # The three publishers offer different things, and these steps use what
      # each actually has. Checked rather than assumed:
      #   johnvansickle  .md5     200     .sha256  404
      #   gyan.dev       .sha256  303 ->  .../packages/ffmpeg-<version>-essentials_build.zip.sha256
      #   evermeet.cx    nothing - its JSON API offers only a GPG .sig and a size
      #
      # gyan's is a redirect to a versioned file rather than a file, which -L
      # follows. Worth knowing for two reasons: a redirect target can move
      # independently of the URL pinned here, and the archive and its digest are
      # fetched as two requests that each resolve to a version. If the build
      # rolls between them the digest belongs to a different archive and the
      # check fails looking exactly like corruption. Narrow window, real cause,
      # and cheaper to recognise here than to diagnose from a red release.
      #
      # So macOS is the gap, and it is a real one. Closing it means trusting and
      # pinning evermeet's signing key, which is a decision worth making
      # deliberately rather than smuggling in here.
      #
      # Every fetch retries, which matters more now than it did. Before, a
      # half-received archive went on to be packaged; now it fails the build, so
      # without retries a flaky runner and a bad file look identical from the
      # log. Retrying makes a failure here mean what the check is for.
      #
      - name: Fetch static ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          NAME=ffmpeg-release-amd64-static.tar.xz
          curl -fsSL --retry 3 --retry-all-errors "https://johnvansickle.com/ffmpeg/releases/$NAME" -o "$NAME"
          curl -fsSL --retry 3 --retry-all-errors "https://johnvansickle.com/ffmpeg/releases/$NAME.md5" -o "$NAME.md5"
          # The published file names the archive, so it is checked where it sits.
          md5sum -c "$NAME.md5"
          mkdir -p ffmpeg-static
          tar -xf "$NAME" --strip-components=1 -C ffmpeg-static
          echo "FFMPEG_DIR=$PWD/ffmpeg-static" >> "$GITHUB_ENV"

      # No digest is published for these, so nothing is verified here. Said out
      # loud rather than left to be inferred from the absence of a check.
      - name: Fetch static ffmpeg (macOS, unverified - see above)
        if: runner.os == 'macOS'
        run: |
          mkdir -p ffmpeg-static
          curl -fsSL --retry 3 --retry-all-errors https://evermeet.cx/ffmpeg/getrelease/ffmpeg/zip -o ffmpeg.zip
          curl -fsSL --retry 3 --retry-all-errors https://evermeet.cx/ffmpeg/getrelease/ffprobe/zip -o ffprobe.zip
          unzip -o -q ffmpeg.zip -d ffmpeg-static
          unzip -o -q ffprobe.zip -d ffmpeg-static
          chmod +x ffmpeg-static/ffmpeg ffmpeg-static/ffprobe
          echo "FFMPEG_DIR=$PWD/ffmpeg-static" >> "$GITHUB_ENV"

      - name: Fetch static ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -fsSL --retry 3 --retry-all-errors https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -o ffmpeg.zip
          curl -fsSL --retry 3 --retry-all-errors https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip.sha256 -o ffmpeg.zip.sha256
          # Published as bare hex with no file name and no trailing newline, so
          # the line sha256sum wants is assembled here.
          echo "$(cat ffmpeg.zip.sha256)  ffmpeg.zip" | sha256sum -c -
          unzip -o -q ffmpeg.zip -d ffmpeg-unpacked
          BIN=$(find ffmpeg-unpacked -name 'ffmpeg.exe' -printf '%h\n' | head -1)
          echo "FFMPEG_DIR=$(cygpath -w "$PWD/$BIN")" >> "$GITHUB_ENV"

      - name: Stage ffmpeg, and prove it runs
        run: node scripts/stage-ffmpeg.mjs --from "${{ env.FFMPEG_DIR }}"

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      #
      # Compile the app before packaging it. This is not a convenience step.
      #
      # electron-builder packages `out/**/*` and package.json, and `out` is
      # gitignored - `git ls-files out` returns nothing. On a runner's fresh
      # checkout it therefore does not exist, so without this the installer
      # would ship package.json alone, with its `main` pointing at
      # out/main/main.cjs, a file that is not in the package. Reproduced by
      # deleting out/ locally and starting the app:
      #
      #   Error: Cannot find module '...\app\out\main\main.cjs'.
      #   Please verify that the package.json has a valid "main" entry
      #
      # That is what every installer this workflow published would have done.
      # package.json's own `dist` and `release` scripts are
      # `npm run build && electron-builder`; this workflow had the second half
      # without the first. No run ever reached it: the only one, on v1.0.0,
      # failed earlier, at typecheck.
      #
      - name: Compile main, preload and renderer
        run: npm run build

      - name: Build the installer
        run: npx electron-builder ${{ matrix.target }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Kept even when publishing succeeds, so a broken draft can be compared
      # against what the runner actually produced.
      - name: Keep the artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-installers
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: warn
          retention-days: 14
